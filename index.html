<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <title>K&B Management Nexus</title>
  <style>
      .kb-boot-fallback{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 38%,#254a70 0%,#142943 42%,#0b1729 100%);color:#fff;font-family:system-ui,sans-serif}
      .kb-boot-mark{display:grid;place-items:center;width:76px;height:76px;border-radius:23px;background:linear-gradient(145deg,#ffbd68,#e57b2b);box-shadow:0 12px 40px #f09a4b55;font-size:23px;letter-spacing:.04em;animation:kbBootPop .75s ease both}
      .kb-boot-fallback span{font-size:14px;font-weight:800;letter-spacing:1.3px;color:#ffc27b}
      .kb-boot-fallback small{font-size:9px;font-weight:700;letter-spacing:3px;color:#b9c9dc}
      .kb-boot-fallback i{width:100px;height:3px;margin-top:15px;border-radius:9px;background:linear-gradient(90deg,#ffb25f 0 42%,#ffffff25 42%);animation:kbBootLoad 1.2s ease-in-out infinite alternate}
      @keyframes kbBootPop{from{opacity:0;transform:scale(.7) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes kbBootLoad{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
      @media(prefers-reduced-motion:reduce){.kb-boot-mark,.kb-boot-fallback i{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="kb-boot-fallback" role="status" aria-label="Starting K&B Management Nexus">
        <strong class="kb-boot-mark">K&amp;B</strong>
        <span>K&amp;B NET SERVICE</span>
        <small>MANAGEMENT NEXUS</small>
        <i aria-hidden="true"></i>
      </main>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
