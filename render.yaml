services:
  - type: web
    name: vypaar-management-api
    runtime: node
    plan: free
    region: singapore
    branch: desktop-web-2026-11-12
    rootDir: render-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/_healthcheck
    autoDeploy: false
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_CODE
        sync: false
      - key: JOB_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
