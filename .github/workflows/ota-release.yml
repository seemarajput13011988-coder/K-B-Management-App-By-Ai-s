name: Publish K&B Nexus live update bundle

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/ota-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kandb-nexus-ota-release
  cancel-in-progress: false

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and type-check the app
        env:
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Create Capgo-compatible update bundle
        id: bundle
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          export OTA_VERSION="$VERSION"
          npx --yes @capgo/cli@latest bundle zip kandbnet.service2010 --path ./dist --bundle "$VERSION" --name "kandb-nexus-$VERSION" --json > /tmp/kb-ota-bundle.json
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const raw = fs.readFileSync('/tmp/kb-ota-bundle.json', 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');
          if (start < 0 || end <= start) throw new Error('Capgo CLI did not return bundle JSON.');
          const info = JSON.parse(raw.slice(start, end + 1));
          if (!/^[a-f0-9]{64}$/i.test(String(info.checksum || ''))) throw new Error('Capgo CLI did not return a valid SHA-256 checksum.');
          const zipCandidates = execFileSync('find', ['.', '-maxdepth', '2', '-type', 'f', '-name', '*.zip', '-not', '-path', './node_modules/*'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          if (zipCandidates.length !== 1) throw new Error('Expected exactly one generated OTA zip, found ' + zipCandidates.length);
          fs.copyFileSync(zipCandidates[0], 'kandb-nexus-bundle.zip');
          const version = process.env.OTA_VERSION;
          fs.writeFileSync('kandb-nexus-metadata.json', JSON.stringify({
            appId: 'kandbnet.service2010',
            version,
            checksum: String(info.checksum).toLowerCase(),
            createdAt: new Date().toISOString(),
            commit: process.env.GITHUB_SHA
          }, null, 2));
          NODE
      - name: Publish immutable OTA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-ota-v${{ steps.bundle.outputs.version }}
          name: K&B Nexus live update v${{ steps.bundle.outputs.version }}
          body: Automated, checksum-verified web bundle for the K&B Management Nexus Android app. Native Android code and plugin changes require a new APK.
          files: |
            kandb-nexus-bundle.zip
            kandb-nexus-metadata.json
          make_latest: true
          fail_on_unmatched_files: true
