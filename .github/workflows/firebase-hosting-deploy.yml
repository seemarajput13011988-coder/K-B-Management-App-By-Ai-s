name: Deploy K&B Management Nexus to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: firebase-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FUNCTIONS_URL: https://asia-south1-kandb-net-sevice.cloudfunctions.net/api
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || (echo "Missing GitHub secret: VITE_FIREBASE_API_KEY" && exit 1)
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || (echo "Missing GitHub secret: VITE_FIREBASE_AUTH_DOMAIN" && exit 1)
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || (echo "Missing GitHub secret: VITE_FIREBASE_STORAGE_BUCKET" && exit 1)
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || (echo "Missing GitHub secret: VITE_FIREBASE_MESSAGING_SENDER_ID" && exit 1)
          test -n "$VITE_FIREBASE_APP_ID" || (echo "Missing GitHub secret: VITE_FIREBASE_APP_ID" && exit 1)
          npm run build

      - name: Deploy production Hosting site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAND_BET_NET_SEVICE }}
          projectId: kandb-net-sevice
          channelId: live
