name: Firebase Functions typecheck
on:
  push:
    branches:
      - firebase-migration
    paths:
      - "functions/**"
  pull_request:
    branches:
      - firebase-migration
    paths:
      - "functions/**"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
