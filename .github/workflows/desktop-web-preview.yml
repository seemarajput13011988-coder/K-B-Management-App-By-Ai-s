name: Vypaar Management website deployment

on:
  push:
    branches:
      - desktop-web-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vypaar-management-live-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out desktop web branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build browser application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAND_B_NET_SEVICE }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Create Firebase Hosting site if needed
        run: |
          npx --yes firebase-tools@latest hosting:sites:get vypaarmanagement --project kandb-net-sevice >/dev/null 2>&1 || \
            npx --yes firebase-tools@latest hosting:sites:create vypaarmanagement --project kandb-net-sevice

      - name: Deploy website to vypaarmanagement.web.app
        run: npx --yes firebase-tools@latest deploy --only hosting:vypaarmanagement --project kandb-net-sevice --non-interactive

      - name: Remove temporary service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
