name: K&B Render backend checks
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [render-backend-migration]
    paths: ["render-backend/**", "src/**", "package.json", "package-lock.json", ".github/workflows/render-backend-check.yml"]
  pull_request:
    branches: [main]
    paths: ["render-backend/**", "src/**", "package.json", "package-lock.json"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Verify staff registration route contracts
        working-directory: .
        run: |
          set -euo pipefail
          grep -Fq "method === 'POST' && path === '/api/staff-registration-requests'" render-backend/api-handler.ts
          grep -Fq "method === 'GET' && path === '/api/staff-registration-requests/status'" render-backend/api-handler.ts
          grep -Fq "path === '/api/staff-registration-requests' && method === 'GET'" render-backend/api-handler.ts
          grep -Fq "path.startsWith('/api/staff-registration-requests/') && method === 'PUT'" render-backend/api-handler.ts
          grep -Fq "if (!allow(user, ['admin'], res)) return;" render-backend/api-handler.ts
          echo "Public request/status and admin-only list/review handlers are present."
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build frontend
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyAuJuFA1I06aSJ1AyHhVA86ws8c_cX1ZC8'
          VITE_FIREBASE_AUTH_DOMAIN: kandb-net-sevice.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: kandb-net-sevice.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '847932976304'
          VITE_FIREBASE_APP_ID: '1:847932976304:web:87148565df2a329a5f9f75'
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com
        run: |
          npm install
          npx tsc --noEmit
          npm run build

  api-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live API and Firestore-backed login lookup
        run: |
          set -euo pipefail
          base="https://kandb-management-nexus-api-zv7f.onrender.com"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 "$base/api/_healthcheck"
          for path in "/api/holidays" "/api/locations/history"; do
            status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-protected-route.json -w '%{http_code}' "$base$path")
            if [ "$status" != "401" ]; then
              cat /tmp/kb-protected-route.json
              echo "::error::Expected $path to exist and require authentication (401), received HTTP $status."
              exit 1
            fi
          done
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-protected-route.json -w '%{http_code}' -X PUT "$base/api/attendance/__smoke__/day-type" -H 'Content-Type: application/json' --data '{}')
          if [ "$status" != "401" ]; then
            cat /tmp/kb-protected-route.json
            echo "::error::Expected attendance correction route to exist and require authentication (401), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-protected-route.json -w '%{http_code}' -X POST "$base/api/attendance/gps-lost" -H 'Content-Type: application/json' --data '{}')
          if [ "$status" != "401" ]; then
            cat /tmp/kb-protected-route.json
            echo "::error::Expected GPS-loss route to exist and require authentication (401), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-registration.json -w '%{http_code}' -X POST "$base/api/staff-registration-requests" -H 'Content-Type: application/json' --data '{}')
          if [ "$status" != "400" ]; then
            cat /tmp/kb-registration.json
            echo "::error::Expected public staff registration route to validate input (400), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-registration.json -w '%{http_code}' "$base/api/staff-registration-requests/status")
          if [ "$status" != "400" ]; then
            cat /tmp/kb-registration.json
            echo "::error::Expected registration status route to require a tracking code (400), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-registration.json -w '%{http_code}' "$base/api/staff-registration-requests")
          if [ "$status" != "401" ]; then
            cat /tmp/kb-registration.json
            echo "::error::Expected admin registration list to require authentication (401), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o /tmp/kb-registration.json -w '%{http_code}' -X PUT "$base/api/staff-registration-requests/__smoke__" -H 'Content-Type: application/json' --data '{}')
          if [ "$status" != "401" ]; then
            cat /tmp/kb-registration.json
            echo "::error::Expected registration review route to require admin authentication (401), received HTTP $status."
            exit 1
          fi
          status=$(curl --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 -o /tmp/kb-login-probe.json -w '%{http_code}' -X POST "$base/api/auth/login" -H 'Content-Type: application/json' --data '{"userId":"__kb_firestore_health_probe__","password":"not-a-real-password"}')
          if [ "$status" != "401" ]; then
            cat /tmp/kb-login-probe.json
            echo "::error::Expected a 401 invalid-credentials response from the Firestore-backed login lookup, received HTTP $status."
            exit 1
          fi
          echo "API health check passed and Firestore-backed login lookup returned the expected 401 without writing data."

  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and request background check
        env:
          K_B_JOB_SECRET: ${{ secrets.K_B_JOB_SECRET }}
        run: |
          if [ -z "$K_B_JOB_SECRET" ]; then
            echo "::warning::Set K_B_JOB_SECRET to enable the five-minute wake-up check."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 55 -X POST "https://kandb-management-nexus-api-zv7f.onrender.com/internal/jobs/tick" -H "x-kb-job-secret: $K_B_JOB_SECRET"
