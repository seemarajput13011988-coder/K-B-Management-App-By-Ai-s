name: K&B Render backend checks
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [render-backend-migration]
    paths: ["render-backend/**", "src/**", "package.json", "package-lock.json", ".github/workflows/render-backend-check.yml"]
  pull_request:
    branches: [main]
    paths: ["render-backend/**", "src/**", "package.json", "package-lock.json"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build frontend
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyAuJuFA1I06aSJ1AyHhVA86ws8c_cX1ZC8'
          VITE_FIREBASE_AUTH_DOMAIN: kandb-net-sevice.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: kandb-net-sevice.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '847932976304'
          VITE_FIREBASE_APP_ID: '1:847932976304:web:87148565df2a329a5f9f75'
          VITE_API_BASE_URL: https://kandb-management-nexus-api.onrender.com
        run: |
          npm install
          npx tsc --noEmit
          npm run build

  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and request background check
        env:
          K_B_RENDER_API_URL: ${{ secrets.K_B_RENDER_API_URL }}
          K_B_JOB_SECRET: ${{ secrets.K_B_JOB_SECRET }}
        run: |
          if [ -z "$K_B_RENDER_API_URL" ] || [ -z "$K_B_JOB_SECRET" ]; then
            echo "::warning::Set K_B_RENDER_API_URL and K_B_JOB_SECRET to enable the five-minute wake-up check."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 55 -X POST "$K_B_RENDER_API_URL/internal/jobs/tick" -H "x-kb-job-secret: $K_B_JOB_SECRET"
