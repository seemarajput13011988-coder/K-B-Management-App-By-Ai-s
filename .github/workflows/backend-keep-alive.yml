name: Render background jobs scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-background-jobs
  cancel-in-progress: true

jobs:
  tick-background-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the Render API
        env:
          HEALTH_URL: https://kandb-management-nexus-api-zv7f.onrender.com/api/_healthcheck
        run: |
          set -eu
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors "$HEALTH_URL"

      - name: Run scheduled attendance, GPS and reminder checks
        env:
          JOB_URL: https://kandb-management-nexus-api-zv7f.onrender.com/internal/jobs/tick
          K_B_JOB_SECRET: ${{ secrets.K_B_JOB_SECRET }}
        run: |
          set -eu
          if [ -z "${K_B_JOB_SECRET:-}" ]; then
            echo "::error::K_B_JOB_SECRET is missing. Add it in GitHub Actions and make it match the Render JOB_SECRET."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST "$JOB_URL" \
            -H "x-kb-job-secret: $K_B_JOB_SECRET"
