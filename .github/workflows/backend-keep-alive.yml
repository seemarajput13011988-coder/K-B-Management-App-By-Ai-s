name: Render background jobs scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-background-jobs
  cancel-in-progress: true

jobs:
  tick-background-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Render API
        env:
          HEALTH_URL: https://kandb-management-nexus-api-zv7f.onrender.com/api/_healthcheck
        run: |
          set -eu
          curl --fail --silent --show-error --connect-timeout 15 --max-time 90 --retry 1 --retry-delay 5 --retry-all-errors "$HEALTH_URL"

      - name: Confirm the Render in-process scheduler owns job execution
        run: |
          set -eu
          echo "Render runs scheduled jobs internally at startup and every 60 seconds."
          echo "This workflow only wakes the free-tier service; it does not call the protected job endpoint."
