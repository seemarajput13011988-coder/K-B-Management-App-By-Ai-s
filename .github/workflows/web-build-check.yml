name: Web app build check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - safe-firebase-migration-copilot-review
      - on-demand-gps-proof-permissions
      - ui-rebuild-gps-holidays-api-fixes
      - whole-app-gps-ui-sync-audit-2026-11-07
      - nexus-workforce-payroll-media-ui-2026-11-07
      - nexus-release-audit-2026-11-07
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "capacitor.config.ts"
      - "index.html"
      - ".env.example"
      - ".github/workflows/web-build-check.yml"
      - "firebase.json"
      - ".firebaserc"
  pull_request:
    branches:
      - main
      - fixes-session-gps-ui-2026-11-06
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type-check and build against the active Render API
        env:
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com
        run: |
          npx tsc --noEmit
          npm run build
          npx --yes @capgo/cli@latest bundle zip kandbnet.service2010 --path ./dist --bundle 1.0.1 --name kb-nexus-ci --json > /tmp/kb-ota-ci.json
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const raw = fs.readFileSync('/tmp/kb-ota-ci.json', 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');
          if (start < 0 || end <= start) throw new Error('Capgo CLI did not return JSON metadata.');
          const info = JSON.parse(raw.slice(start, end + 1));
          if (!/^[a-f0-9]{64}$/i.test(String(info.checksum || ''))) throw new Error('Capgo OTA checksum is missing or invalid.');
          const zips = execFileSync('find', ['.', '-maxdepth', '2', '-type', 'f', '-name', '*.zip', '-not', '-path', './node_modules/*'], { encoding: 'utf8' }).trim().split('\\n').filter(Boolean);
          if (zips.length !== 1) throw new Error('Expected one Capgo-compatible OTA zip, found ' + zips.length);
          console.log('Capgo OTA bundle validated:', info.version, 'bytes:', info.size, 'zip:', zips[0]);
          NODE
