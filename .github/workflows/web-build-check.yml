name: Web app build check
on:
  push:
    branches:
      - firebase-migration
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "capacitor.config.ts"
      - "index.html"
      - ".env.example"
      - ".github/workflows/web-build-check.yml"
      - "firebase.json"
      - ".firebaserc"
  pull_request:
    branches:
      - firebase-migration
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
