name: Web app build check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - safe-firebase-migration-copilot-review
      - on-demand-gps-proof-permissions
      - ui-rebuild-gps-holidays-api-fixes
      - whole-app-gps-ui-sync-audit-2026-11-07
      - nexus-workforce-payroll-media-ui-2026-11-07
      - nexus-release-audit-2026-11-07
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "capacitor.config.ts"
      - "index.html"
      - ".env.example"
      - ".github/workflows/web-build-check.yml"
      - ".github/workflows/ota-release.yml"
      - "firebase.json"
      - ".firebaserc"
  pull_request:
    branches:
      - main
      - fixes-session-gps-ui-2026-11-06
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type-check and build against the active Render API
        env:
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com
        run: |
          npx tsc --noEmit
          npm run build
      - name: Validate Capacitor OTA archive packaging
        run: |
          npx --yes @capgo/cli@latest bundle zip kandbnet.service2010 --path dist --json > /tmp/kb-ota-bundle-info.json
          ZIP_FILE="$(find . -type f -name '*.zip' -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Capacitor Updater CLI did not create a bundle archive."
            cat /tmp/kb-ota-bundle-info.json
            exit 1
          fi
          unzip -Z1 "$ZIP_FILE" | grep -Eq '(^|/)index.html
 || {
            echo "::error::The OTA archive is missing index.html."
            exit 1
          }
          echo "Capacitor OTA bundle packaging passed."
