name: Web app build check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - spark-free-backend
    paths:
      - "src/**"
      - "netlify/**"
      - "netlify.toml"
      - "functions/src/http-api.ts"
      - "functions/src/admin.ts"
      - "functions/src/route-path.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "capacitor.config.ts"
      - "index.html"
      - ".env.example"
      - "docs/FIREBASE_SETUP.md"
      - ".github/workflows/web-build-check.yml"
      - "firebase.json"
      - ".firebaserc"
  pull_request:
    branches:
      - spark-free-backend
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type-check and build with the confirmed Firebase Web App configuration
        env:
          VITE_FIREBASE_API_KEY: 'AIzaSyAuJuFA1I06aSJ1AyHhVA86ws8c_cX1ZC8'
          VITE_FIREBASE_AUTH_DOMAIN: kandb-net-sevice.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: kandb-net-sevice.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '847932976304'
          VITE_FIREBASE_APP_ID: '1:847932976304:web:87148565df2a329a5f9f75'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npx tsc --noEmit
          npm run build
          npx esbuild netlify/functions/api.ts netlify/functions/gps-grace-period.ts netlify/functions/daily-reminders.ts --bundle --platform=node --format=esm --outdir=/tmp/netlify-function-check --packages=external
