name: Build private Android APK
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - firebase-migration
      - safe-firebase-migration-copilot-review
      - render-backend-migration
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "firebase.json"
      - ".firebaserc"
      - "functions/**"
      - "docs/ANDROID_TRACKING_AND_RELEASE.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate required release secrets
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=()
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then missing+=("ANDROID_GOOGLE_SERVICES_JSON_BASE64"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub repository secrets: %s\\n' "${missing[@]}"
            echo "::error::Add the missing release secrets before building the production APK."
            exit 1
          fi
          echo "All required release secrets are present."
      - name: Install dependencies and build web app
        env:
          # Firebase web config is public client configuration, not a private key.
          # Use the confirmed Web App key for this Firebase project; do not let a stale Actions secret override it.
          VITE_FIREBASE_API_KEY: 'AIzaSyAuJuFA1I06aSJ1AyHhVA86ws8c_cX1ZC8'
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'kandb-net-sevice.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'kandb-net-sevice.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '847932976304' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:847932976304:web:87148565df2a329a5f9f75' }}
          VITE_API_BASE_URL: https://kandb-management-nexus-api-zv7f.onrender.com
        run: |
          npm install
          npx tsc --noEmit
          npm run build
          npm --prefix functions install
          npm --prefix functions test
          npx cap add android
          npx cap sync android
      - name: Configure and validate Firebase Cloud Messaging for Android
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Set ANDROID_GOOGLE_SERVICES_JSON_BASE64 to enable Android Firebase Cloud Messaging. The final app requires remote notifications."
            exit 1
          fi
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
          const expectedProject = 'kandb-net-sevice';
          const expectedPackage = 'kandbnet.service2010';
          if (config.project_info?.project_id !== expectedProject) {
            throw new Error('The Android Firebase config belongs to a different Firebase project.');
          }
          const clients = Array.isArray(config.client) ? config.client : [];
          const matchingClient = clients.some(client =>
            client.client_info?.android_client_info?.package_name === expectedPackage
          );
          if (!matchingClient) {
            throw new Error('The Android Firebase config does not contain package ' + expectedPackage + '.');
          }
          console.log('Firebase Android config validated for the K&B project and app package.');
          NODE
          else
            echo "::error::FCM config missing."
            exit 1
          fi
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kandb-management-nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
