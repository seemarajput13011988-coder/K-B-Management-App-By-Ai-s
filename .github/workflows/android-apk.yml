name: Build private Android APK
on:
  push:
    branches:
      - firebase-migration
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "firebase.json"
      - ".firebaserc"
      - "functions/**"
      - "docs/ANDROID_TRACKING_AND_RELEASE.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and build web app
        env:
          # Firebase web config is public client configuration, not a private key.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyAuJuFA1I06aSJ1AyHhVA86ws8c_cX1ZC8' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'kandb-net-sevice.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: kandb-net-sevice
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'kandb-net-sevice.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '847932976304' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:847932976304:web:87148565df2a329a5f9f75' }}
          VITE_FIREBASE_FUNCTIONS_URL: https://asia-south1-kandb-net-sevice.cloudfunctions.net/api
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Configure Firebase Cloud Messaging for Android
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase Android messaging configuration installed."
          else
            echo "::warning::FCM is not configured for this build. Add the ANDROID_GOOGLE_SERVICES_JSON_BASE64 repository secret after registering the Android app in Firebase."
          fi
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kandb-management-nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
