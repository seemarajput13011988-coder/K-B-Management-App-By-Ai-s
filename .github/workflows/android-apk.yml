          '''
                  marker = "    buildTypes {"
                  if marker not in source: raise SystemExit("Could not find Android buildTypes block.")
                  source = source.replace(marker, block + "\n" + marker, 1)
              match = re.search(r'(?m)^(\s*)getByName\("release"\)\s*\{', source)
              if not match: raise SystemExit("Could not find release build type in Gradle Kotlin DSL.")
              insert = match.end()
              source = source[:insert] + '\n' + match.group(1) + '    signingConfig = signingConfigs.getByName("release")' + source[insert:]
          else:
              if "signingConfigs {" not in source:
