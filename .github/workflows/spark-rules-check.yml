name: Firestore Spark security tests
on:
  push:
    branches:
      - spark-migration
    paths:
      - "firestore.rules"
      - "tests/firestore.rules.test.mjs"
      - "package.json"
      - "firebase.json"
      - ".github/workflows/spark-rules-check.yml"
  pull_request:
    branches:
      - spark-migration
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install project dependencies
        run: npm install
      - name: Run Firestore rules emulator regression tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-kandb-rules "node --test tests/firestore.rules.test.mjs"
